spring.application.name=smartops-backend
server.servlet.context-path=/api

spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smartops_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (ปิด DEBUG ตอน deploy จริง)
logging.level.org.springframework.security=DEBUG

# Pageable
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=14

# Admin seed
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# upload picture
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB